"fact_number": 268, "category": "Intelligence", "fact": "Dogs are capable of basic counting — they can tell that one object plus one object equals two, and notice when an arithmetic result seems wrong.", "breed": null}, {"fact_number": 269, "category": "Intelligence", "fact": "Dogs follow human pointing gestures better than any other animal — including chimpanzees — and can do so without any training.", "breed": null}, {"fact_number": 270, "category": "Intelligence", "fact": "Dogs learn fastest through positive reinforcement. Rewarding desired behavior consistently produces faster, more reliable results than punishment.", "breed": null}, {"fact_number": 271, "category": "Intelligence", "fact": "Dogs have episodic memory — they can recall specific past events and experiences, not just trained responses.", "breed": null}, {"fact_number": 272, "category": "Intelligence", "fact": "Dogs can recognize their owner's car by the sound of the engine from a distance, even among many vehicles with similar sounds.", "breed": null}, {"fact_number": 273, "category": "Intelligence", "fact": "A Border Collie named Chaser learned the individual names of over 1,022 separate objects — the largest tested vocabulary of any non-human animal.", "breed": "border collie"}, {"fact_number": 274, "category": "Intelligence", "fact": "Border Collies are widely considered the most intelligent dog breed — they can learn a new command in under five seconds and obey it 95% of the time.", "breed": "border collie"}, {"fact_number": 275, "category": "Intelligence", "fact": "Dogs can read human facial expressions, preferring to look at happy faces, and can distinguish between positive and negative emotional states.", "breed": null}, {"fact_number": 276, "category": "Intelligence", "fact": "Dogs have been shown to understand the concept of fairness: they become visibly upset if another dog receives a better reward for performing the same task.", "breed": null}, {"fact_number": 277, "category": "Intelligence", "fact": "A dog named Rico demonstrated 'fast mapping' in 2009 — the same word-learning shortcut used by human children — to rapidly associate names with new objects.", "breed": null}, {"fact_number": 278, "category": "Intelligence", "fact": "Dogs can recognize their owner's voice on a recording and show a measurably stronger response to it than to a stranger's voice.", "breed": null}, {"fact_number": 279, "category": "Intelligence", "fact": "The dog is the only animal known to have a natural, untrained ability to understand human communicative intent — including pointing, gaze, and tone of voice.", "breed": null}, {"fact_number": 280, "category": "Intelligence", "fact": "Dogs possess a form of 'theory of mind' — they can track what another individual knows or has seen and adjust their behavior accordingly.", "breed": null}, {"fact_number": 281, "category": "Health", "fact": "Petting a dog for just 15 minutes triggers the release of oxytocin, serotonin, and prolactin in the human brain — the same hormones involved in social bonding.", "breed": null}, {"fact_number": 282, "category": "Health", "fact": "When you gaze into your dog's eyes, both your and your dog's oxytocin levels rise — the same bonding mechanism found between human parents and their infants.", "breed": null}, {"fact_number": 283, "category": "Health", "fact": "Therapy dogs have been shown to lower blood pressure, reduce cortisol levels, and speed recovery from surgery in hospital patients.", "breed": null}, {"fact_number": 284, "category": "Health", "fact": "Dogs have been found to significantly reduce feelings of loneliness and depression — their presence alone lowers cortisol (the stress hormone) in humans.", "breed": null}, {"fact_number": 285, "category": "Health", "fact": "Dogs can develop Canine Cognitive Dysfunction (CCD) — an Alzheimer's-like condition that affects up to 28% of dogs aged 11–12 and 68% of dogs aged 15–16.", "breed": null}, {"fact_number": 286, "category": "Health", "fact": "Dogs' mouths are not cleaner than humans' mouths — this is a common myth. They simply harbor different bacteria, most of which don't affect humans.", "breed": null}, {"fact_number": 287, "category": "Health", "fact": "Obese dogs live on average 1.5 fewer years than dogs at a healthy weight, according to long-term studies of dog lifespan and body condition.", "breed": null}, {"fact_number": 288, "category": "Health", "fact": "Dogs age more rapidly in their early years — by age 1, a dog is biologically equivalent to a 30-year-old human in terms of cellular aging markers.", "breed": null}, {"fact_number": 289, "category": "Records", "fact": "The world's oldest dog on record was an Australian Cattle Dog named Bluey, who lived to 29 years and 5 months — nearly double the average canine lifespan.", "breed": null}, {"fact_number": 290, "category": "Records", "fact": "The tallest dog ever recorded was a Great Dane named Zeus, who stood 44 inches (112 cm) at the shoulder and could look over a countertop while standing on all fours.", "breed": "great dane"}, {"fact_number": 291, "category": "Records", "fact": "The smallest dog ever recorded was a Chihuahua named Miracle Milly, who measured just 3.8 inches (9.65 cm) tall and weighed under a pound.", "breed": "chihuahua"}, {"fact_number": 292, "category": "Records", "fact": "The highest jump by a dog is 75.5 inches (191.7 cm), set by a Greyhound mix named Feather in Frederick, Maryland in 2017.", "breed": "greyhound"}, {"fact_number": 293, "category": "Records", "fact": "A Labrador Retriever named Endal could operate an ATM, shop in stores, and summon help in emergencies — widely considered the most decorated service dog in history.", "breed": null}, {"fact_number": 294, "category": "Breeds", "fact": "The Australian Shepherd was developed in the western United States, not Australia — it was bred by Basque shepherds who had passed through Australia before emigrating to America.", "breed": "australian shepherd"}, {"fact_number": 295, "category": "Breeds", "fact": "The Poodle's distinctive haircut was originally designed to improve its swimming ability as a waterfowl retriever — pompoms were left to protect the joints from cold water.", "breed": "poodle"}, {"fact_number": 296, "category": "Breeds", "fact": "Dalmatian puppies are born completely white — their distinctive spots begin to appear within the first three to four weeks of life.", "breed": "dalmatian"}, {"fact_number": 297, "category": "Breeds", "fact": "The Basenji is the only domestic dog that cannot bark. Instead of barking, it produces a distinctive yodeling sound known as a 'barroo.'", "breed": "basenji"}, {"fact_number": 298, "category": "Breeds", "fact": "The Norwegian Lundehund has six fully functional toes on each foot and can bend its head all the way back to touch its spine — adaptations developed for puffin hunting on steep cliffs.", "breed": null}, {"fact_number": 299, "category": "Breeds", "fact": "The Chow Chow is among the oldest dog breeds, with fossils resembling the breed found in China dating back more than 2,000 years.", "breed": "chow chow"}, {"fact_number": 300, "category": "Breeds", "fact": "The Irish Wolfhound is the tallest dog breed by average height — when standing on its hind legs, it can reach over 7 feet tall.", "breed": "irish wolfhound"}, {"fact_number": 301, "category": "Breeds", "fact": "The Dachshund was originally bred to hunt badgers — its name literally translates to 'badger dog' in German, and its long body was perfect for following prey into burrows.", "breed": "dachshund"}, {"fact_number": 302, "category": "Breeds", "fact": "The Labrador Retriever was the most popular dog breed in the United States for more than 30 consecutive years before recently being overtaken by the French Bulldog.", "breed": null}, {"fact_number": 303, "category": "Breeds", "fact": "The St. Bernard was developed by monks at the Great St. Bernard Hospice in the Swiss Alps specifically to rescue travelers stranded in avalanches.", "breed": "saint bernard"}, {"fact_number": 304, "category": "Breeds", "fact": "The Siberian Husky can run up to 100 miles a day at sustained speeds of 10–15 mph, burning far fewer calories per mile than scientists initially predicted.", "breed": "siberian husky"}, {"fact_number": 305, "category": "Breeds", "fact": "The Alaskan Malamute is the official state dog of Alaska, recognized for its historical role in sled transport and its deep ties to indigenous Alaskan culture.", "breed": "alaskan malamute"}, {"fact_number": 306, "category": "Breeds", "fact": "The Great Dane was once known as the 'Deutsche Dogge' and was the official dog of Germany, bred to hunt wild boar alongside German nobility.", "breed": "great dane"}, {"fact_number": 307, "category": "Breeds", "fact": "Pugs were bred as lap dogs for Chinese emperors during the Han dynasty and were kept in luxury accommodations with soldiers assigned to guard them.", "breed": "pug"}, {"fact_number": 308, "category": "Breeds", "fact": "Bulldogs were originally bred for bull-baiting, a sport banned in England in 1835 — after the ban, breeders selectively developed the gentle, affectionate temperament Bulldogs are known for today.", "breed": "bulldog"}, {"fact_number": 309, "category": "Breeds", "fact": "The Boxer breed gets its name from its distinctive habit of standing on its hind legs and sparring with its front paws — a behavior seen during play.", "breed": "boxer"}, {"fact_number": 310, "category": "Breeds", "fact": "The Weimaraner was developed in early 19th-century Germany for hunting large game such as deer, boar, and bear — it was originally called the 'Weimar Pointer.'", "breed": "weimaraner"}, {"fact_number": 311, "category": "Breeds", "fact": "The Vizsla is the only breed that is uniformly golden-rust in color — its nose, eyes, nails, and coat all match, making it one of the most visually consistent breeds.", "breed": "vizsla"}, {"fact_number": 312, "category": "Breeds", "fact": "The Borzoi can reportedly see objects nearly a mile away, thanks to its wide-angle vision and deep chest that supports long, sustained running in open terrain.", "breed": "borzoi"}, {"fact_number": 313, "category": "Breeds", "fact": "The Pembroke Welsh Corgi is one of the breeds most closely associated with British royalty — Queen Elizabeth II owned more than 30 Corgis over the course of her reign.", "breed": "corgi"}, {"fact_number": 314, "category": "Breeds", "fact": "The Beagle's white-tipped tail was selectively bred so hunters could spot the dog in tall grass during a hunt, even when the rest of its body was hidden.", "breed": "beagle"}, {"fact_number": 315, "category": "Breeds", "fact": "The Dalmatian's strong association with firehouses dates back to the era of horse-drawn fire carriages — Dalmatians ran alongside to clear paths and calm the horses.", "breed": "dalmatian"}, {"fact_number": 316, "category": "Breeds", "fact": "The Rottweiler descended from the Roman Molossus, a massive war dog that accompanied Roman legions through Europe to herd cattle and guard camps.", "breed": "rottweiler"}, {"fact_number": 317, "category": "Breeds", "fact": "The German Shepherd breed was formally established in 1899 by cavalry captain Max von Stephanitz, who sought to create the ultimate working dog.", "breed": "german shepherd"}, {"fact_number": 318, "category": "Breeds", "fact": "The Doberman Pinscher was created in the 1880s by a German tax collector named Karl Friedrich Louis Dobermann, who wanted a loyal and intimidating companion for his rounds.", "breed": "doberman"}, {"fact_number": 319, "category": "Breeds", "fact": "The Samoyed's permanently upturned mouth corners — the famous 'Samoyed smile' — prevent drooling in freezing temperatures, which could cause ice to form on the dog's face.", "breed": "samoyed"}, {"fact_number": 320, "category": "Breeds", "fact": "The Shiba Inu was nearly wiped out during World War II. Only three surviving breeding lines were combined after the war to restore the breed.", "breed": "shiba inu"}, {"fact_number": 321, "category": "Breeds", "fact": "The Akita is considered a symbol of good health and happiness in Japan. Small Akita figurines are traditionally given to sick patients as a wish for swift recovery.", "breed": "akita"}, {"fact_number": 322, "category": "Breeds", "fact": "Jack Russell Terriers were bred by Reverend John Russell in the 1800s specifically to bolt foxes from their dens during hunts without injuring them.", "breed": "jack russell terrier"}, {"fact_number": 323, "category": "Breeds", "fact": "The Pointer's signature 'point' — freezing with nose, body, and raised paw aimed directly at game — is an instinctive behavior nearly unique in the animal kingdom.", "breed": "pointer"}, {"fact_number": 324, "category": "Breeds", "fact": "The Pembroke and Cardigan Welsh Corgis are two entirely separate breeds. The Cardigan is the older of the two and has a long tail; the Pembroke typically does not.", "breed": "corgi"}, {"fact_number": 325, "category": "Breeds", "fact": "The Finnish Lapphund was used by the Sámi people of northern Scandinavia for thousands of years to herd reindeer across the Arctic tundra.", "breed": "finnish lapphund"}, {"fact_number": 326, "category": "Breeds", "fact": "The Papillon gets its name from the French word for 'butterfly,' referring to the shape of its large, fringed, wing-like ears.", "breed": "papillon"}, {"fact_number": 327, "category": "Breeds", "fact": "The Bull Terrier is the only dog breed with distinctly triangular eyes — it is the only breed in the world with non-oval eyes.", "breed": "bull terrier"}, {"fact_number": 328, "category": "Breeds", "fact": "The Basset Hound's long, velvety ears serve a functional purpose: they sweep scent particles from the ground upward toward the nose while the dog tracks a trail.", "breed": "basset hound"}, {"fact_number": 329, "category": "Breeds", "fact": "The Great Pyrenees has double dewclaws — two extra toes — on each hind foot, an evolutionary adaptation that provides better grip on snowy mountain terrain.", "breed": "great pyrenees"}, {"fact_number": 330, "category": "Breeds", "fact": "The Portuguese Water Dog has webbed feet, a waterproof coat, and a thick tail used as a rudder — all natural adaptations for herding fish and retrieving gear at sea.", "breed": "portuguese water dog"}, {"fact_number": 331, "category": "History", "fact": "A dog named Hachiko, an Akita, waited loyally at Shibuya Station in Tokyo every day for nine years after his owner died in 1925. A bronze statue of Hachiko stands at the station today.", "breed": "akita"}, {"fact_number": 332, "category": "History", "fact": "A Newfoundland named Seaman accompanied Meriwether Lewis on the Lewis and Clark Expedition of 1804–1806, trekking thousands of miles across North America.", "breed": "newfoundland"}, {"fact_number": 333, "category": "History", "fact": "Barry, a legendary St. Bernard rescue dog who worked in the Swiss Alps in the early 1800s, is credited with saving more than 40 lives.", "breed": "saint bernard"}, {"fact_number": 334, "category": "History", "fact": "The Shiba Inu is one of Japan's six native breeds and has been designated a Natural Monument of Japan, protected by the government since 1936.", "breed": "shiba inu"}, {"fact_number": 335, "category": "History", "fact": "In Aztec culture, the Xoloitzcuintli — the Mexican Hairless Dog — was believed to guide the souls of the deceased safely through the underworld after death.", "breed": null}, {"fact_number": 336, "category": "History", "fact": "Dogs were used by the ancient Egyptians as hunting companions over 4,000 years ago, with depictions of sighthound-type dogs appearing in tomb paintings across the Nile Valley.", "breed": null}, {"fact_number": 337, "category": "History", "fact": "The Pomeranian was originally a much larger sled-pulling dog from the Pomerania region of Europe — Queen Victoria is credited with popularizing the miniature version after returning from a trip to Florence in 1888.", "breed": null}, {"fact_number": 338, "category": "History", "fact": "Dogs and wolves living today both descend from an ancient wolf population that lived alongside woolly mammoths, according to genetic studies published in 2022.", "breed": null}, {"fact_number": 339, "category": "History", "fact": "Belka and Strelka became the first dogs to survive orbital spaceflight, returning safely to Earth after a day in space on August 20, 1960.", "breed": null}, {"fact_number": 340, "category": "History", "fact": "Paul McCartney recorded a high-frequency whistle at the end of the Beatles song 'A Day in the Life' specifically so that only dogs could hear it.", "breed": null}, {"fact_number": 341, "category": "History", "fact": "The term 'dog days of summer' comes from Roman astronomy — the sweltering heat was believed to occur when Sirius, the Dog Star, rose alongside the sun.", "breed": null}, {"fact_number": 342, "category": "History", "fact": "Greyhounds are the only breed specifically mentioned in the Bible (Proverbs 30:31 in certain translations), described among things that are 'stately in their stride.'", "breed": "greyhound"}, {"fact_number": 343, "category": "Culture", "fact": "The United States has the highest dog population in the world, with an estimated 90 million pet dogs — roughly one dog for every four households.", "breed": null}, {"fact_number": 344, "category": "Culture", "fact": "The most popular dog names in the United States are 'Max' for males and 'Bella' for females, according to data collected from veterinary clinics and registries.", "breed": null}, {"fact_number": 345, "category": "Culture", "fact": "Police dogs — K9s — are often granted official officer rank in their departments. In many jurisdictions, harming a police dog is treated as assaulting a law enforcement officer.", "breed": null}, {"fact_number": 346, "category": "Culture", "fact": "Dogs are mentioned 35 times in the Bible, making them the most frequently referenced animal in that text.", "breed": null}, {"fact_number": 347, "category": "Culture", "fact": "In ancient China, Emperor Tang of the Tang dynasty reportedly owned 2,500 pairs of hunting dogs, each pair with a dedicated handler.", "breed": "chow chow"}, {"fact_number": 348, "category": "Culture", "fact": "In South Korea, it is considered good luck to have a dog cross your path — the opposite of the superstition many cultures hold about black cats.", "breed": null}, {"fact_number": 349, "category": "Breeds", "fact": "The Lhasa Apso was bred by Tibetan monks as an indoor sentinel dog — it would bark to alert the larger Tibetan Mastiff guard dogs of any intruders approaching the monastery.", "breed": "lhasa apso"}, {"fact_number": 350, "category": "Breeds", "fact": "The Leonberger was bred in the 1840s in Leonberg, Germany, with the goal of creating a dog that resembled the lion on the town's coat of arms.", "breed": "leonberger"}, {"fact_number": 351, "category": "Breeds", "fact": "The Otterhound has webbed feet and a rough, double coat that repels water — traits bred specifically for hunting otters along riverbanks in medieval England.", "breed": "otterhound"}, {"fact_number": 352, "category": "Breeds", "fact": "The Pekingese was so revered in imperial China that commoners were required to bow to the breed — and theft of one was punishable by death.", "breed": "pekingese"}, {"fact_number": 353, "category": "Breeds", "fact": "The Brussels Griffon was a favorite pet of Belgian Queen Marie Henriette in the late 1800s, which helped launch the breed's popularity across Europe.", "breed": "brussels griffon"}, {"fact_number": 354, "category": "Breeds", "fact": "The Kerry Blue Terrier is the national dog of Ireland, named for County Kerry where it was developed as an all-purpose farm dog for hunting, herding, and guarding.", "breed": "kerry blue terrier"}, {"fact_number": 355, "category": "Breeds", "fact": "The Japanese Chin was historically given as a gift between Japanese and Korean royalty, and was considered a symbol of aristocratic status in ancient Japan.", "breed": "japanese chin"}, {"fact_number": 356, "category": "Breeds", "fact": "The Borzoi — also known as the Russian Wolfhound — was bred by Russian aristocrats to course wolves across the open steppe, hunting in pairs or trios.", "breed": "borzoi"}, {"fact_number": 357, "category": "Breeds", "fact": "The Norwegian Elkhound is one of the oldest Spitz breeds, used by Vikings for hunting elk, bear, and moose and as a loyal companion on longship voyages.", "breed": "norwegian elkhound"}, {"fact_number": 358, "category": "Breeds", "fact": "The Skye Terrier was a favorite of Mary, Queen of Scots — one of her dogs reportedly refused to leave her side even after her execution in 1587.", "breed": "skye terrier"}, {"fact_number": 359, "category": "Breeds", "fact": "The Irish Wolfhound was so prized in ancient Ireland that Gaelic law set strict limits on how many could be owned based on rank — only kings could own six.", "breed": "irish wolfhound"}, {"fact_number": 360, "category": "History", "fact": "The Iditarod Trail Sled Dog Race in Alaska commemorates a famous 1925 relay in which sled dog teams delivered life-saving diphtheria antitoxin to Nome across 674 miles of frozen wilderness.", "breed": null}, {"fact_number": 361, "category": "Behavior", "fact": "Dogs have been observed bringing their owners gifts — including toys, sticks, or household objects — as a form of greeting or to share their excitement.", "breed": null}, {"fact_number": 362, "category": "Sensory", "fact": "Dogs can hear the ultrasonic frequencies emitted by rodents — a range completely inaudible to humans — which is part of why they are such effective ratters.", "breed": null}, {"fact_number": 363, "category": "Behavior", "fact": "Dogs use play bows — stretching the front legs forward and lowering the chest — as a universal signal to other dogs and humans that what follows is just play.", "breed":  "athletic"], "caption": "Pointer. Spots the bird. Holds the pose. Awaits applause."}, {"file": "skye_terrier_1.jpg", "breeds": ["skye terrier"], "tags": ["terrier", "small breed", "scottish breed", "long coat"], "caption": "Skye Terrier. Long coat. Longer memory."}];
const TOTAL = FACTS.length;

const photosByBreed = {};
PHOTOS.forEach(p => {
  p.breeds.forEach(b => {
    if (!photosByBreed[b]) photosByBreed[b] = [];
    photosByBreed[b].push(p);
  });
});

function getDayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  return Math.ceil((now - start) / 86400000);
}

const todayFactNum = Math.min(getDayOfYear(), TOTAL);
let current = todayFactNum;

function pickPhoto(factNum, breed) {
  let pool = breed && photosByBreed[breed] ? photosByBreed[breed] : [];
  if (pool.length === 0) pool = photosByBreed['generic'] || [];
  if (pool.length === 0) return null;
  return pool[factNum % pool.length];
}

function render(factNum) {
  const fact = FACTS[factNum - 1];

  // Photo
  const photo = pickPhoto(factNum, fact.breed);
  if (photo) {
    document.getElementById('dog-photo').src = 'images/' + photo.file;
    document.getElementById('dog-photo').alt = photo.caption;
    document.getElementById('photo-caption').textContent = photo.caption;
  }

  // Today banner
  const banner = document.getElementById('today-banner');
  if (factNum === todayFactNum) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const now = new Date();
    banner.textContent = '\u2605 Fact of the Day \u2014 ' +
      months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }

  // Fact card
  const card = document.getElementById('fact-card');
  card.className = 'fact-card' + (factNum === todayFactNum ? ' today-highlight' : '');
  card.innerHTML =
    '<div class="fact-number">Fact #' + fact.fact_number + '</div>' +
    '<div class="fact-category">' + fact.category + '</div>' +
    '<div class="fact-text">' + fact.fact + '</div>' +
    '<div class="fact-footer">' +
      (fact.breed ? '<span class="fact-breed-tag">' + fact.breed + '</span>' : '<span></span>') +
      '<button class="share-btn" onclick="shareFact(' + fact.fact_number + ')">&#8679; Share</button>' +
    '</div>';

  // Counter & buttons
  document.getElementById('fact-num').textContent = factNum;
  document.getElementById('btn-first').disabled = factNum <= 1;
  document.getElementById('btn-back').disabled = factNum <= 1;
  document.getElementById('btn-next').disabled = factNum >= TOTAL;
  document.getElementById('btn-last').disabled = factNum >= TOTAL;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareFact(factNum) {
  const fact = FACTS[factNum - 1];
  const text = 'Fact #' + factNum + ': ' + fact.fact + ' — The Bark Facts';
  if (navigator.share) {
    navigator.share({ title: 'The Bark Facts', text: text });
  } else {
    navigator.clipboard.writeText(text).then(function() {
      const btn = document.querySelector('.share-btn');
      const orig = btn.innerHTML;
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.innerHTML = orig; }, 1500);
    });
  }
}

function changeFact(delta) {
  const next = current + delta;
  if (next >= 1 && next <= TOTAL) {
    current = next;
    render(current);
  }
}

function goToFact(n) {
  if (n >= 1 && n <= TOTAL) {
    current = n;
    render(current);
  }
}

render(current);
</script>
